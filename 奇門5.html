<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>奇門遁甲 · 雙視圖式盤 v7</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center
    }

    canvas {
      display: block;
      width: min(100vw, calc(100vh*16/9));
      height: auto;
      touch-action: none;
      user-select: none;
      cursor: grab
    }

    canvas.dragging {
      cursor: grabbing
    }
  </style>
</head>

<body>
  <canvas id="c" width="1920" height="1080"></canvas>
  <script>
    (() => {
      'use strict';

      /* ================= 基本設定 ================= */
      const W = 1920, H = 1080;
      const cvs = document.getElementById('c');
      const ctx = cvs.getContext('2d');
      const DPR = Math.min(window.devicePixelRatio || 1, 2);
      cvs.width = W * DPR; cvs.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

      const SERIF = "'Noto Serif TC','Noto Serif SC','Songti TC','SimSun',serif";
      const SANS = "'Noto Sans TC','Noto Sans SC','PingFang TC','Microsoft JhengHei',sans-serif";
      const MONO = "'Consolas','Menlo','Courier New',monospace";
      const TAU = Math.PI * 2;
      const ease = t => t * t * (3 - 2 * t);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const pad = n => String(n).padStart(2, '0');

      /* ================= 數據 ================= */
      const STEM = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
      const BRANCH = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
      const EARTH_SEQ = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
      const RING9 = [1, 8, 3, 4, 9, 2, 7, 6, 5];
      const RING8 = [1, 8, 3, 4, 9, 2, 7, 6];
      const PAL = {1: '坎', 2: '坤', 3: '震', 4: '巽', 5: '中', 6: '乾', 7: '兌', 8: '艮', 9: '離'};
      const DIR = {1: '正北', 2: '西南', 3: '正東', 4: '東南', 5: '中宮', 6: '西北', 7: '正西', 8: '東北', 9: '正南'};
      // 2D 九宮位置：上南下北，左東右西
      const GRID = {4: [0, 0], 9: [1, 0], 2: [2, 0], 3: [0, 1], 5: [1, 1], 7: [2, 1], 8: [0, 2], 1: [1, 2], 6: [2, 2]};
      // 3D 環形位置：離（南）居上，順時針
      const SLOT9 = [9, 2, 7, 6, 1, 8, 3, 4, 5];
      const SLOT8 = [9, 2, 7, 6, 1, 8, 3, 4];
      const STAR = {1: '天蓬', 2: '天芮', 3: '天沖', 4: '天輔', 5: '天禽', 6: '天心', 7: '天柱', 8: '天任', 9: '天英'};
      const DOOR = {1: '休', 2: '死', 3: '傷', 4: '杜', 6: '開', 7: '驚', 8: '生', 9: '景'};
      const DOOR_JI = {'休': 1, '生': 1, '開': 1};
      const GODS = [
        {n: '值符', j: '吉', m: '主帥所臨，統領諸神'},
        {n: '騰蛇', j: '凶', m: '主虛驚、怪異、迷惑'},
        {n: '太陰', j: '吉', m: '主隱秘、謀劃、陰私'},
        {n: '六合', j: '吉', m: '主和合、婚姻、交易'},
        {n: '白虎', j: '凶', m: '主征伐、刑傷、凶猛'},
        {n: '玄武', j: '凶', m: '主盜賊、暗昧、欺詐'},
        {n: '九地', j: '吉', m: '主潛藏、堅守、安定'},
        {n: '九天', j: '吉', m: '主高舉、進取、顯揚'}
      ];
      const XUN_HIDDEN = {0: '戊', 10: '己', 8: '庚', 6: '辛', 4: '壬', 2: '癸'};
      const XUN_NAME = {'戊': '甲子', '己': '甲戌', '庚': '甲申', '辛': '甲午', '壬': '甲辰', '癸': '甲寅'};
      const TERMS = ['春分', '清明', '穀雨', '立夏', '小滿', '芒種', '夏至', '小暑', '大暑', '立秋', '處暑', '白露',
        '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒', '立春', '雨水', '驚蟄'];
      const JU = {
        18: [1, 7, 4], 19: [2, 8, 5], 20: [3, 9, 6], 21: [8, 5, 2], 22: [9, 6, 3], 23: [1, 7, 4],
        0: [3, 9, 6], 1: [4, 1, 7], 2: [5, 2, 8], 3: [4, 1, 7], 4: [5, 2, 8], 5: [6, 3, 9],
        6: [9, 3, 6], 7: [8, 2, 5], 8: [7, 1, 4], 9: [2, 5, 8], 10: [1, 4, 7], 11: [9, 3, 6],
        12: [7, 1, 4], 13: [6, 9, 3], 14: [5, 8, 2], 15: [6, 9, 3], 16: [5, 8, 2], 17: [4, 7, 1]
      };
      const YUAN_NAME = ['上元', '中元', '下元'];
      const MANSION = ['角', '亢', '氐', '房', '心', '尾', '箕', '斗', '牛', '女', '虛', '危', '室', '壁',
        '奎', '婁', '胃', '昴', '畢', '觜', '參', '井', '鬼', '柳', '星', '張', '翼', '軫'];
      // 八卦爻：自下而上（1 為陽爻），依後天方位
      const BAGUA = {
        1: ['坎', [0, 1, 0]], 2: ['坤', [0, 0, 0]], 3: ['震', [1, 0, 0]], 4: ['巽', [0, 1, 1]],
        6: ['乾', [1, 1, 1]], 7: ['兌', [1, 1, 0]], 8: ['艮', [0, 0, 1]], 9: ['離', [1, 0, 1]]
      };
      const JIU_TIAN = {1: '玄天', 6: '幽天', 7: '昊天', 2: '朱天', 9: '炎天', 4: '陽天', 3: '蒼天', 8: '變天', 5: '鈞天'};
      const JIU_DI = {1: '冀州', 8: '兗州', 3: '青州', 4: '徐州', 9: '揚州', 2: '荊州', 7: '梁州', 6: '雍州', 5: '豫州'};
      const DIPPER = ['天樞', '天璇', '天璣', '天權', '玉衡', '開陽', '搖光'];

      /* ================= 天文與排盤（時家盤） ================= */
      function sunLon(ms) {
        const n = ms / 86400000 + 2440587.5 - 2451545.0;
        const L = 280.460 + 0.9856474 * n;
        const g = (357.528 + 0.9856003 * n) * Math.PI / 180;
        let lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) % 360;
        return lam < 0 ? lam + 360 : lam;
      }
      function termStart(ms, deg) {
        let t = ms;
        for (let i = 0; i < 4; i++) {
          let d = sunLon(t) - deg;
          d = ((d + 540) % 360) - 180;
          t -= d / 0.9856474 * 86400000;
        }
        return t;
      }
      function calc(ms) {
        const d = new Date(ms), h = d.getHours();
        const b = Math.floor(((h + 1) % 24) / 2);
        const h0 = (2 * b - 1 + 24) % 24;
        const blk = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h0, 0, 0, 0);
        if (h0 > h) blk.setDate(blk.getDate() - 1);

        const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        if (h === 23) dd.setDate(dd.getDate() + 1);
        const jdn = Math.round(Date.UTC(dd.getFullYear(), dd.getMonth(), dd.getDate()) / 86400000) + 2440588;
        const dIdx = ((jdn + 49) % 60 + 60) % 60;
        const dayStem = dIdx % 10;
        const dayName = STEM[dIdx % 10] + BRANCH[dIdx % 12];

        const tStem = (2 * (dayStem % 5) + b) % 10;
        const timeName = STEM[tStem] + BRANCH[b];

        const xunB = ((b - tStem) % 12 + 12) % 12;
        const H6 = XUN_HIDDEN[xunB];
        const fuMs = blk.getTime() - tStem * 7200000;

        const k = Math.floor(sunLon(fuMs) / 15) % 24;
        const days = (fuMs - termStart(fuMs, k * 15)) / 86400000;
        const yuan = Math.min(2, Math.max(0, Math.floor(days / 5)));
        const yang = (k >= 18 || k <= 5);
        const ju = JU[k][yuan];

        const ring = yang ? RING9 : RING9.slice().reverse();
        const i0 = ring.indexOf(ju);
        const earth = {};
        for (let i = 0; i < 9; i++) earth[ring[(i0 + i) % 9]] = EARTH_SEQ[i];
        const palOf = {};
        for (const p in earth) palOf[earth[p]] = +p;

        const PH = palOf[H6];
        const T = tStem === 0 ? PH : palOf[STEM[tStem]];

        const dd9 = (RING9.indexOf(T) - RING9.indexOf(PH) + 9) % 9;
        const tStar = {}, tStemMap = {};
        RING9.forEach((from, j) => {
          const to = RING9[(j + dd9) % 9];
          tStar[to] = STAR[from];
          tStemMap[to] = earth[from];
        });

        const p8 = p => p === 5 ? (yang ? 2 : 8) : p;
        const dd8 = (RING8.indexOf(p8(T)) - RING8.indexOf(p8(PH)) + 8) % 8;
        const door = {};
        RING8.forEach((from, j) => {door[RING8[(j + dd8) % 8]] = DOOR[from];});

        const god = {};
        const T8 = RING8.indexOf(p8(T));
        for (let i = 0; i < 8; i++) {
          const idx = ((T8 + (yang ? i : -i)) % 8 + 8) % 8;
          god[RING8[idx]] = GODS[i];
        }

        return {
          b, dayName, timeName, xunName: XUN_NAME[H6], H6, PH, T, k, yang, yuan,
          term: TERMS[k], yuanName: YUAN_NAME[yuan], ju,
          earth, tStar, tStemMap, door, god,
          valueStar: tStar[T], valueDoor: door[p8(T)], valueGod: god[p8(T)],
          valueDoorPal: p8(T)
        };
      }

      /* ================= 狀態 ================= */
      const STEP = 7200000;
      const state = {ms: Date.now(), sel: 1, playing: false, spin: true, mode: '3d'};
      let cacheMs = null, cacheC = null;
      function getC() {
        if (cacheMs !== state.ms) {cacheC = calc(state.ms); cacheMs = state.ms;}
        return cacheC;
      }
      function shiftTime(n) {state.ms += n * STEP;}
      function togglePlay() {state.playing = !state.playing;}
      function toggleMode() {state.mode = state.mode === '3d' ? '2d' : '3d';}

      // 3D 各層
      const ORDER = ['mansion', 'term', 'palace', 'bagua', 'door', 'star', 'jiu', 'sun', 'bei'];
      const NAMES = {
        mansion: '二十八星宿', term: '二十四節氣', palace: '九宮', bagua: '八卦', door: '八門',
        star: '九星', jiu: '九天九地', sun: '太陽', bei: '北斗'
      };
      const LAY = {};
      ORDER.forEach(k => {LAY[k] = {p: 1, on: true};});
      // 2D 各層（地盤、天盤、人盤、神盤）
      const SHOW = {earth: true, heaven: true, human: true, god: true};
      const SHOW_NAMES = {earth: '地盤', heaven: '天盤', human: '人盤', god: '神盤'};

      const K = 0.84;
      const RW = {mansion: 420, term: 350, palace: 300, bagua: 236, door: 180, star: 128, jiu: 92, dipper: 50, tai: 20};
      const LZ_STEP = 56;
      const PITCH_MIN = 25, PITCH_MAX = 90, PITCH_DEFAULT = 62;
      const view = {pitch: PITCH_DEFAULT, pitchT: PITCH_DEFAULT, az: -25, zoom: 1, expand: 0};
      const zOf = k => ORDER.indexOf(k) * LZ_STEP * ease(LAY[k].p) * view.expand;
      const F = 1500, CX = 960, CY = 575;
      const HITS = [];

      /* ================= 3D 投影與環形座標 ================= */
      function P(x, y, z) {
        const b = view.az * Math.PI / 180, a = view.pitch * Math.PI / 180;
        const x1 = x * Math.cos(b) - y * Math.sin(b);
        const y1 = x * Math.sin(b) + y * Math.cos(b);
        const dep = y1 * Math.cos(a) - z * Math.sin(a);
        const up = y1 * Math.sin(a) + z * Math.cos(a);
        const s = F / (F + dep) * view.zoom;
        return {x: CX + x1 * s, y: CY - up * s, s};
      }
      function at(t, r, z = 0) {return P(Math.cos(t) * r * K, Math.sin(t) * r * K, z);}
      function ringPts(r, z, n = 240) {
        const pts = [];
        for (let i = 0; i <= n; i++) pts.push(at(i / n * TAU, r, z));
        return pts;
      }
      function arcPts(r, t0, t1, z, n = 24) {
        const pts = [];
        for (let i = 0; i <= n; i++) pts.push(at(t0 + (t1 - t0) * i / n, r, z));
        return pts;
      }
      const a9 = p => Math.PI / 2 + SLOT9.indexOf(p) * TAU / 9;
      const a8 = p => Math.PI / 2 + SLOT8.indexOf(p) * TAU / 8;
      const a24 = k => Math.PI / 2 + k * TAU / 24;
      const a28 = i => Math.PI / 2 + i * TAU / 28;

      /* ================= 共用繪圖工具 ================= */
      function strokePts(pts, color, lw, alpha = 1, dash = null, glow = 0) {
        if (alpha < 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color; ctx.lineWidth = lw;
        if (dash) ctx.setLineDash(dash);
        if (glow) {ctx.shadowColor = color; ctx.shadowBlur = glow;}
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.restore();
      }
      function txt(s, x, y, size, color, o = {}) {
        const {font = SANS, weight = 'normal', align = 'center', alpha = 1, glow = 0} = o;
        if (size < 4 || alpha < 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.textAlign = align; ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        if (glow) {ctx.shadowColor = color; ctx.shadowBlur = glow;}
        ctx.fillText(s, x, y);
        ctx.restore();
      }
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function node(x, y, r, color, alpha = 1) {
        if (r < 0.5 || alpha < 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
        g.addColorStop(0, color);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#f4feff';
        ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, TAU); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      function dot(x, y, r, color, alpha) {
        if (alpha < 0.01) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
        ctx.restore();
      }
      function flowRing(r, z, count, speed, t, color, alpha) {
        for (let i = 0; i < count; i++) {
          const u = (i / count + t * speed) % 1;
          const q = at(u * TAU, r, z);
          dot(q.x, q.y, 2 * q.s, color, alpha);
        }
      }
      function taiji(c, r, alpha) {
        if (alpha < 0.01 || r < 1) return;
        ctx.save();
        ctx.globalAlpha = alpha;
        const DARK = '#0a1a2a', LIGHT = '#f4feff';
        ctx.fillStyle = LIGHT;
        ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.fill();
        ctx.fillStyle = DARK;
        ctx.beginPath(); ctx.arc(c.x, c.y, r, Math.PI / 2, Math.PI * 1.5); ctx.fill();
        ctx.fillStyle = LIGHT;
        ctx.beginPath(); ctx.arc(c.x, c.y - r / 2, r / 2, 0, TAU); ctx.fill();
        ctx.fillStyle = DARK;
        ctx.beginPath(); ctx.arc(c.x, c.y + r / 2, r / 2, 0, TAU); ctx.fill();
        ctx.fillStyle = DARK;
        ctx.beginPath(); ctx.arc(c.x, c.y - r / 2, r / 8, 0, TAU); ctx.fill();
        ctx.fillStyle = LIGHT;
        ctx.beginPath(); ctx.arc(c.x, c.y + r / 2, r / 8, 0, TAU); ctx.fill();
        ctx.strokeStyle = '#f4d37a'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      // 深色按鈕（3D 視圖）
      function button(label, x, y, w, h, active, fn, size = 22) {
        ctx.save();
        rr(x, y, w, h, 10);
        ctx.fillStyle = active ? 'rgba(47,230,255,0.22)' : 'rgba(4,22,38,0.7)';
        ctx.fill();
        ctx.strokeStyle = active ? '#7ff3ff' : '#1d6f8a';
        ctx.lineWidth = 1.8; ctx.stroke();
        ctx.restore();
        txt(label, x + w / 2, y + h / 2 + 1, size, active ? '#e9fdff' : '#7fd9ea',
          {weight: 'bold', glow: active ? 8 : 0});
        HITS.push({x, y, w, h, fn});
      }
      // 木色按鈕（2D 視圖）
      function button2(label, x, y, w, h, active, fn, size = 22) {
        ctx.save();
        rr(x, y, w, h, 10);
        ctx.fillStyle = active ? '#5a3d1f' : '#efe2bf';
        ctx.fill();
        ctx.strokeStyle = '#5a3d1f'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
        txt(label, x + w / 2, y + h / 2 + 1, size, active ? '#fdf6e3' : '#4a3218',
          {weight: 'bold', font: SANS});
        HITS.push({x, y, w, h, fn});
      }
      function panel(x, y, w, h, accent = '#2fe6ff') {
        ctx.save();
        rr(x, y, w, h, 14);
        ctx.fillStyle = 'rgba(4,22,38,0.72)'; ctx.fill();
        ctx.strokeStyle = accent; ctx.globalAlpha = 0.55; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.restore();
      }
      function card2(x, y, w, h) {
        ctx.save();
        rr(x, y, w, h, 14);
        ctx.fillStyle = 'rgba(255,251,238,0.94)'; ctx.fill();
        ctx.strokeStyle = '#8b6b3d'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
      }

      /* ================= 3D 背景 ================= */
      const STARS = Array.from({length: 220}, () => ({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.4 + 0.2, ph: Math.random() * TAU
      }));
      function drawBG3D(t) {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#04172e');
        g.addColorStop(1, '#010308');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        const rg = ctx.createRadialGradient(CX, CY - 150, 40, CX, CY - 150, 950);
        rg.addColorStop(0, 'rgba(0,190,255,0.20)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
        STARS.forEach(s => {
          ctx.globalAlpha = 0.25 + 0.6 * Math.abs(Math.sin(t * 0.8 + s.ph));
          ctx.fillStyle = '#bff6ff';
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      /* ================= 3D 各層 ================= */
      function drawMansion(C, t) {
        const e = LAY.mansion.p; if (e < 0.01) return;
        const z = zOf('mansion');
        strokePts(ringPts(RW.mansion, z, 300), '#f4d37a', 2, 0.85 * e, null, 8);
        for (let i = 0; i < 28; i++) {
          const th = a28(i);
          strokePts([at(th, RW.mansion - 12, z), at(th, RW.mansion + 6, z)], '#f4d37a', 1.4, 0.85 * e);
          const q = at(th, RW.mansion + 22, z);
          txt(MANSION[i], q.x, q.y, 15 * q.s, '#ffe9a0', {alpha: e, weight: 'bold'});
        }
        flowRing(RW.mansion, z, 24, 0.035, t, '#ffe9a0', 0.8 * e);
      }
      function drawTerm(C, t) {
        const e = LAY.term.p; if (e < 0.01) return;
        const z = zOf('term');
        strokePts(ringPts(RW.term, z, 240), '#2fe6ff', 1.6, 0.7 * e, null, 6);
        for (let k = 0; k < 24; k++) {
          const th = a24(k);
          strokePts([at(th, RW.term - 8, z), at(th, RW.term + 8, z)], '#2fe6ff', 1.4, 0.8 * e);
          const cur = k === C.k;
          const q = at(th, RW.term - 26, z);
          txt(TERMS[k], q.x, q.y, (cur ? 14 : 12) * q.s, cur ? '#ffd36b' : '#c9f3ff',
            {weight: cur ? 'bold' : 'normal', alpha: e, glow: cur ? 10 : 0});
        }
        flowRing(RW.term, z, 18, -0.04, t, '#9ff3ff', 0.8 * e);
      }

          button2(SHOW_NAMES[k], 115 + i * 170, by, 150, bh, SHOW[k], () => {SHOW[k] = !SHOW[k];}, 22);
        });
        button2('◀ 上一時辰', 1000, by, 220, bh, false, () => shiftTime(-1), 22);
        button2('下一時辰 ▶', 1230, by, 220, bh, false, () => shiftTime(1), 22);
        button2('回到現在', 1460, by, 200, bh, false, () => {state.ms = Date.now();}, 22);
        button2(state.playing ? '暫停 ■' : '自動演示 ▶', 1670, by, 230, bh, state.playing, togglePlay, 22);
        txt('示意演算：局數依節氣三元表，未含超神接氣與閏局修正，僅供學習參考。', W / 2, 1074, 15, '#6b4a1e', {font: SANS});
      }
      function render2D(C) {
        drawParchment();
        txt('奇門遁甲 · 時家九宮八門九星八神式盤', W / 2, 50, 38, '#2b1d0e', {font: SERIF, weight: 'bold'});
        txt('點選宮位檢視詳情  ｜  底部切換四層  ｜  ← → 調整時辰，空格自動演示，N 回到現在',
          W / 2, 92, 18, '#7a5c2e', {font: SANS});
        drawBoard2D(C);
        drawRight2D(C);
        drawBottom2D();
      }

      /* ================= 模式切換按鈕（兩種視圖皆顯示） ================= */
      function drawModeToggle() {
        const label = state.mode === '3d' ? '切換至 2D 九宮' : '切換至 3D 環形';
        if (state.mode === '3d') button(label, 1620, 28, 220, 36, false, toggleMode, 16);
        else button2(label, 1620, 28, 220, 36, false, toggleMode, 16);
      }

      /* ================= 總繪製 ================= */
      function render(t) {
        HITS.length = 0;
        const C = getC();
        if (state.mode === '2d') render2D(C);
        else render3D(C, t);
        drawModeToggle();
      }

      /* ================= 互動 ================= */
      function toCanvas(e) {
        const r = cvs.getBoundingClientRect();
        return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
      }
      function pickPalace3D(x, y) {
        let best = null, bd = Infinity;
        for (let p = 1; p <= 9; p++) {
          const c = at(a9(p), RW.palace, zOf('palace'));
          const d = Math.hypot(x - c.x, y - c.y);
          if (d < 40 * c.s && d < bd) {bd = d; best = p;}
        }
        return best;
      }
      let drag = null;
      cvs.addEventListener('pointerdown', e => {
        const pt = toCanvas(e);
        drag = {sx: e.clientX, sy: e.clientY, moved: false, x: pt.x, y: pt.y};
        cvs.setPointerCapture(e.pointerId);
        cvs.classList.add('dragging');
      });
      cvs.addEventListener('pointermove', e => {
        if (!drag || state.mode !== '3d') return;
        const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) drag.moved = true;
        if (drag.moved) {
          view.az += dx * 0.3;
          view.pitchT = clamp(view.pitchT + dy * 0.2, PITCH_MIN, PITCH_MAX);
          drag.sx = e.clientX; drag.sy = e.clientY;
        }
      });
      cvs.addEventListener('pointerup', e => {
        if (drag && !drag.moved) {
          const pt = toCanvas(e);
          let handled = false;
          for (let i = HITS.length - 1; i >= 0; i--) {
            const h = HITS[i];
            if (pt.x >= h.x && pt.x <= h.x + h.w && pt.y >= h.y && pt.y <= h.y + h.h) {
              h.fn(); handled = true; break;
            }
          }
          if (!handled && state.mode === '3d') {
            const p = pickPalace3D(pt.x, pt.y);
            if (p) state.sel = p;
          }
        }
        drag = null;
        cvs.classList.remove('dragging');
      });
      cvs.addEventListener('wheel', e => {
        if (state.mode !== '3d') return;
        e.preventDefault();
        view.pitchT = clamp(view.pitchT - e.deltaY * 0.05, PITCH_MIN, PITCH_MAX);
      }, {passive: false});
      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') shiftTime(-1);
        else if (e.key === 'ArrowRight') shiftTime(1);
        else if (e.key === ' ') {e.preventDefault(); togglePlay();}
        else if (e.key === 'n' || e.key === 'N') state.ms = Date.now();
        else if (e.key === 'm' || e.key === 'M') toggleMode();
        else if (state.mode === '3d') {
          if (e.key === 'r' || e.key === 'R') state.spin = !state.spin;
          else if (e.key === 'e' || e.key === 'E') toggleCollapse();
          else if (e.key === 'ArrowUp') view.pitchT = clamp(view.pitchT - 3, PITCH_MIN, PITCH_MAX);
          else if (e.key === 'ArrowDown') view.pitchT = clamp(view.pitchT + 3, PITCH_MIN, PITCH_MAX);
          else if (e.key >= '1' && e.key <= '9') LAY[ORDER[+e.key - 1]].on = !LAY[ORDER[+e.key - 1]].on;
        } else {
          const keys = ['earth', 'heaven', 'human', 'god'];
          if (e.key >= '1' && e.key <= '4') {const k = keys[+e.key - 1]; SHOW[k] = !SHOW[k];}
        }
      });

      /* ================= 動畫迴圈 ================= */
      let last = performance.now(), playT = 0;
      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        view.pitch += (view.pitchT - view.pitch) * Math.min(1, dt * 6);
        view.expand = clamp((PITCH_MAX - view.pitch) / (PITCH_MAX - PITCH_MIN), 0, 1);

        if (state.spin && !(drag && drag.moved)) view.az += dt * 4;
        ORDER.forEach(k => {
          const tgt = LAY[k].on ? 1 : 0;
          LAY[k].p += (tgt - LAY[k].p) * Math.min(1, dt * 5);
        });
        if (state.playing) {
          playT += dt;
          if (playT > 1.6) {playT = 0; shiftTime(1);}
        }
        render(now / 1000);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
